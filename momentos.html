<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda · El Día</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rust:     #9B4A2E;
      --mauve:    #A85C78;
      --sage:     #4A6B44;
      --bg:       #F7F2EA;
      --card:     #FDFAF6;
      --input-bg: #F2EDE4;
      --text:     #2C3A28;
      --muted:    #5A6E52;
      --light:    #D4C5B5;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ──────────────────────────────── */
    header {
      text-align: center;
      padding: 64px 20px 28px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--text);
    }
    header .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-top: 10px;
    }
    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
    }
    .ornament::before, .ornament::after {
      content: '';
      height: 1px;
      width: 72px;
      background: var(--mauve);
    }
    .ornament span { color: var(--mauve); font-size: 9px; }

    /* ── TABS ────────────────────────────────── */
    .momento-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 720px;
      margin: 32px auto 0;
      padding: 0 20px;
    }
    .momento-tab {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      border-radius: 50px;
      border: 1.5px solid var(--light);
      background: var(--card);
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.03em;
      color: var(--muted);
      cursor: pointer;
      transition: all .18s;
    }
    .momento-tab:hover { border-color: var(--mauve); color: var(--text); }
    .momento-tab.active { background: var(--rust); border-color: var(--rust); color: #fff; }
    .momento-tab .count { font-size: 0.7rem; opacity: 0.75; }

    /* ── MAIN ────────────────────────────────── */
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty-hint {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .empty-hint strong {
      display: block;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 400;
    }

    /* ── BLOQUES (hoja en blanco por momento) ──── */
    .block { position: relative; }
    .block-controls {
      position: absolute;
      top: -8px; right: -8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity .15s;
      z-index: 2;
    }
    .block:hover .block-controls, .block:focus-within .block-controls { opacity: 1; }
    .block-controls .ctrl-btn { background: var(--card); font-size: 13px; font-weight: 700; }
    .ctrl-btn:disabled { opacity: .3; cursor: default; }
    .ctrl-btn:disabled:hover { border-color: var(--light); color: var(--muted); }

    .block-text {
      background: var(--card);
      border-radius: 14px;
      padding: 20px 24px;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--text);
      outline: none;
      box-shadow: 0 2px 14px rgba(44,58,40,.08);
      min-height: 56px;
      transition: box-shadow .2s;
    }
    .block-text:focus { box-shadow: 0 0 0 2px var(--mauve); }
    .block-text:empty::before { content: attr(data-ph); color: var(--muted); opacity: .6; }

    .block-image {
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 2px 14px rgba(44,58,40,.08);
      max-width: 420px;
    }
    .block-image img { width: 100%; display: block; }

    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--card);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 2px 14px rgba(44,58,40,.08);
    }
    .check-box { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--sage); cursor: pointer; flex-shrink: 0; }
    .check-text { flex: 1; font-size: 0.92rem; outline: none; line-height: 1.5; }
    .check-text:empty::before { content: attr(data-ph); color: var(--muted); opacity: .6; }
    .block-check.done .check-text { text-decoration: line-through; color: var(--muted); }

    .add-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 40px 20px;
      background: var(--input-bg);
      border: 2px dashed var(--light);
      border-radius: 14px;
    }
    .add-hint svg { width: 26px; height: 26px; opacity: .5; }

    /* ── MODAL ───────────────────────────────── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(44,58,40,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 18px;
      padding: 32px 36px;
      width: min(440px, 90vw);
      box-shadow: 0 20px 60px rgba(44,58,40,.18);
    }
    .modal h3 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      font-weight: 400;
      margin-bottom: 20px;
      color: var(--text);
    }
    .modal-tabs {
      display: flex;
      border: 1.5px solid var(--light);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1; padding: 9px; border: none; background: none;
      font-family: 'Lato', sans-serif; font-size: 0.8rem;
      letter-spacing: 0.04em; cursor: pointer; color: var(--muted);
      transition: background .15s, color .15s;
    }
    .tab-btn.active { background: var(--rust); color: #fff; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .modal input[type="url"],
    .modal input[type="file"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--light);
      border-radius: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
      transition: border-color .2s;
    }
    .modal input[type="url"]:focus { border-color: var(--mauve); }
    .modal input[type="file"] { padding: 9px; cursor: pointer; }
    .modal-hint { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }

    .upload-progress {
      margin-top: 10px;
      height: 4px;
      background: var(--light);
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .upload-progress-bar {
      height: 100%;
      background: var(--sage);
      border-radius: 2px;
      width: 0%;
      transition: width .2s;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      justify-content: flex-end;
    }
    .btn {
      padding: 9px 22px;
      border-radius: 8px;
      border: none;
      font-family: 'Lato', sans-serif;
      font-size: 0.83rem;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-cancel { background: var(--light); color: var(--muted); }
    .btn-confirm { background: var(--rust); color: #fff; }

    .ctrl-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1.5px solid var(--light);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .ctrl-btn:hover { border-color: var(--mauve); color: var(--text); }
    .ctrl-btn svg { width: 14px; height: 14px; pointer-events: none; }

    /* ── ITINERARIO ──────────────────────────── */
    .itin-list { display: flex; flex-direction: column; gap: 12px; }
    .itin-row {
      background: var(--card);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 2px 14px rgba(44,58,40,.08);
    }
    .itin-hora-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 110px;
      flex-shrink: 0;
    }
    .itin-ampm {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--rust);
      line-height: 1.1;
    }
    .itin-hora {
      font-family: 'Lato', sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      background: none;
      border: none;
      outline: none;
      padding: 0;
      cursor: pointer;
    }
    .itin-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .itin-evento, .itin-nota {
      background: var(--input-bg);
      border: 1.5px solid var(--light);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Lato', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    .itin-evento { font-size: 0.92rem; font-weight: 700; }
    .itin-nota { font-size: 0.82rem; color: var(--muted); }
    .itin-evento:focus, .itin-nota:focus { border-color: var(--mauve); }
    .itin-evento::placeholder, .itin-nota::placeholder { color: var(--muted); opacity: .5; }
    .itin-del { flex-shrink: 0; }

    @media (max-width: 680px) {
      .itin-row { flex-wrap: wrap; }
      .itin-hora-wrap { width: auto; }
      .itin-main { flex-basis: 100%; order: 3; }
    }

    /* ── BARRA DE AÑADIR ──────────────────────── */
    .add-section-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 8px 0 40px;
    }
    .block-add-bar { flex-direction: row; justify-content: center; flex-wrap: wrap; }
    .add-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      border-radius: 50px;
      border: 2px dashed var(--light);
      background: none;
      font-family: 'Lato', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
    }
    .add-btn:hover { border-color: var(--sage); color: var(--sage); }

    /* ── EXPORT BUTTON ───────────────────────── */
    .export-btn {
      position: fixed;
      bottom: 28px; right: 28px;
      display: flex; align-items: center; gap: 8px;
      padding: 13px 26px;
      background: var(--rust); color: #fff;
      border: none; border-radius: 50px;
      font-family: 'Lato', sans-serif; font-size: 0.85rem;
      letter-spacing: 0.06em;
      cursor: pointer; z-index: 50;
      box-shadow: 0 4px 20px rgba(155,74,46,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .export-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(155,74,46,.45); }
    .export-btn svg { width: 15px; height: 15px; }

    /* ── RESPONSIVE ──────────────────────────── */
    @media (max-width: 680px) {
      .momento-tab { padding: 9px 14px; font-size: 0.78rem; }
    }

    /* ── PRINT / PDF ─────────────────────────── */
    @media print {
      @page { size: A4; margin: 12mm 14mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

      .export-btn, .add-section-area, .momento-tabs, .itin-del, .block-controls, #modal { display: none !important; }

      body { background: #F7F2EA !important; }

      header { padding: 28px 0 16px; }

      main { max-width: 100%; padding: 0; gap: 10px; }

      .block-text, .check-row, .itin-row {
        break-inside: avoid;
        page-break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #d4c5b5;
      }

      .add-hint { display: none !important; }
    }
  </style>
</head>
<body>

<header>
  <h1>El Gran Día</h1>
  <p class="subtitle">Cesar &amp; Lissette · 13 Marzo 2027</p>
  <div class="ornament"><span>◆</span></div>
</header>

<nav class="momento-tabs" id="momento-tabs"></nav>

<main id="container"></main>

<button class="export-btn" onclick="window.print()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <rect x="6" y="14" width="12" height="8"/>
  </svg>
  Exportar PDF
</button>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Añadir foto</h3>
    <div class="modal-tabs">
      <button class="tab-btn active" data-tab="file">Subir foto</button>
      <button class="tab-btn" data-tab="url">Pegar URL</button>
    </div>
    <div class="tab-pane active" id="pane-file">
      <input type="file" id="file-input" accept="image/*" />
      <p class="modal-hint">JPG, PNG, HEIC… Se comprime y se comparte con quien tenga el enlace.</p>
      <div class="upload-progress" id="upload-progress">
        <div class="upload-progress-bar" id="upload-bar"></div>
      </div>
    </div>
    <div class="tab-pane" id="pane-url">
      <input type="url" id="url-input" placeholder="https://i.pinimg.com/…" />
      <p class="modal-hint">Pega la URL desde Pinterest, Google Images, etc.</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">Cancelar</button>
      <button class="btn btn-confirm" id="modal-confirm">Guardar</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp }   from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js';
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query, where }
  from 'https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:            'AIzaSyATR-1uUqpJFZAG9OPOjxYas7DjvEEVRCo',
  authDomain:        'boda-cesar-lissette.firebaseapp.com',
  projectId:         'boda-cesar-lissette',
  storageBucket:     'boda-cesar-lissette.firebasestorage.app',
  messagingSenderId: '1080316555242',
  appId:             '1:1080316555242:web:48614150034617521ecc93',
}, 'momentos');

const db          = getFirestore(app);
// Documento dentro de la colección "inspo" (ya autorizada en las reglas de
// Firestore) en vez de una colección "momentos" propia, que las reglas
// actuales no cubren y rechazarían con permission-denied.
const MOMENTOS_REF = doc(db, 'inspo', 'momentos');

// Cada foto es su propio documento dentro de "inspo" (id determinista
// photo_<ownerId>_<idx>). Firebase Storage no está activado en este
// proyecto (probado: el bucket da 404), así que las fotos subidas desde
// el ordenador también se guardan aquí como dataURL comprimido — así
// sincronizan igual que las pegadas por URL, entre cualquier
// dispositivo/persona que abra la página.
const photosQuery = query(collection(db, 'inspo'), where('kind', '==', 'momento_photo'));
function photoDocId(ownerId, idx) { return `photo_${ownerId}_${idx}`; }

// ── Momentos (pestañas) ─────────────────────────────────────
const MOMENTOS = [
  { id: 'bienvenida', label: 'Bienvenida' },
  { id: 'ceremonia',  label: 'Ceremonia'  },
  { id: 'recepcion',  label: 'Recepción'  },
  { id: 'cena',       label: 'Cena'       },
  { id: 'fiesta',     label: 'Fiesta'     },
  { id: 'otros',      label: 'Otros'      },
];
// El itinerario es una pestaña más, pero no es una hoja de bloques: es una
// lista de hora+evento+nota que se ordena sola por hora.
const ITINERARIO_ID = 'itinerario';
const ALL_TABS = [...MOMENTOS, { id: ITINERARIO_ID, label: 'Itinerario' }];
let activeMomento = MOMENTOS[0].id;

// ── Estado ────────────────────────────────────────────────
// blocks: { [momentoId]: [ {id,type:'text',content} | {id,type:'image',photoOwner,photoIdx} | {id,type:'check',text,done} ] }
// itinerary: [{ id, hora, evento, nota }]
// photos: { [ownerId]: [url0,url1,url2] } — viene de la query de fotos, no se persiste aquí
let state = { blocks: {}, itinerary: [], photos: {}, _sv: 0 };
let firstLoad = true;

// ── Migración desde el modelo viejo de "fichas" (título+notas+3 fotos) ──
// Las primeras versiones de esta página guardaban cards+notes en vez de
// blocks. Se convierte una sola vez a bloques (texto + imagen) para no
// perder lo que ya se había escrito, sin borrar los campos viejos.
let momentosLoaded = false, photosLoaded = false, migrated = false;
let oldCards = [], oldNotes = {};

function tryMigrate() {
  if (migrated || !momentosLoaded || !photosLoaded || !oldCards.length) return;
  migrated = true;
  let changed = false;
  oldCards.forEach(c => {
    if (!c.momento) return;
    state.blocks[c.momento] = state.blocks[c.momento] || [];
    const already = state.blocks[c.momento].some(b => b._migratedFrom === c.id);
    if (already) return;
    const titleLine = c.title
      ? `<strong>${c.title}</strong>${c.label ? ` <span style="opacity:.6">(${c.label})</span>` : ''}<br>`
      : '';
    const body = oldNotes[c.id] || '';
    if (titleLine || body) {
      state.blocks[c.momento].push({ id: 'b_mig_' + c.id + '_t', type: 'text', content: titleLine + body, _migratedFrom: c.id });
      changed = true;
    }
    (state.photos[c.id] || []).forEach((url, idx) => {
      if (!url) return;
      state.blocks[c.momento].push({ id: 'b_mig_' + c.id + '_i' + idx, type: 'image', photoOwner: c.id, photoIdx: idx, _migratedFrom: c.id });
      changed = true;
    });
  });
  if (changed) { persistBlocks(); renderAll(); }
}

// ── Firestore ─────────────────────────────────────────────
let blocksSaveTimer;
function persistBlocks() {
  clearTimeout(blocksSaveTimer);
  setDoc(MOMENTOS_REF, { blocks: state.blocks }, { merge: true }).catch(console.error);
}
function persistBlocksDebounced() {
  clearTimeout(blocksSaveTimer);
  blocksSaveTimer = setTimeout(() => {
    setDoc(MOMENTOS_REF, { blocks: state.blocks }, { merge: true }).catch(console.error);
  }, 600);
}
function persistItinerary() {
  setDoc(MOMENTOS_REF, { itinerary: state.itinerary }, { merge: true }).catch(console.error);
}

onSnapshot(MOMENTOS_REF, snap => {
  if (snap.exists()) {
    const d = snap.data();
    // Solo se hidrata el estado desde Firestore en la primera carga. Después,
    // cada guardado (incluso el nuestro, con el debounce de 400ms) dispara
    // este mismo listener otra vez — si volviéramos a reemplazar
    // state.blocks/state.itinerary aquí, los objetos que los bloques ya
    // renderizados tienen capturados en sus propios listeners de 'input'
    // quedarían huérfanos (apuntando a un objeto que ya no es el que vive en
    // state), y lo que se siguiera escribiendo se guardaría sobre datos
    // viejos o directamente no se guardaría. El estado local manda una vez
    // cargado; los cambios de otra persona/dispositivo se ven al recargar.
    if (firstLoad) {
      state.blocks    = d.blocks    || {};
      state.itinerary = d.itinerary || [];
    }
    state._sv = d._sv || 0;
    oldCards  = d.cards || [];
    oldNotes  = d.notes || {};
  }
  momentosLoaded = true;
  tryMigrate();
  if (firstLoad) {
    renderAll(); firstLoad = false;
  }
}, err => {
  console.error('Error cargando momentos:', err);
  document.getElementById('container').innerHTML =
    `<p style="padding:1rem;color:#9B4A2E;font-size:.85rem;text-align:center">
      No se pudo cargar: ${err.message}
    </p>`;
});

onSnapshot(photosQuery, snap => {
  const photos = {};
  snap.forEach(d => {
    const data = d.data();
    const arr = photos[data.cardId] || ['', '', ''];
    arr[data.idx] = data.url || '';
    photos[data.cardId] = arr;
  });
  state.photos = photos;
  photosLoaded = true;
  tryMigrate();
  syncBlockImages();
}, err => console.error('Error cargando fotos:', err));

function syncBlockImages() {
  document.querySelectorAll('.block-image[data-owner]').forEach(el => {
    const owner = el.dataset.owner, idx = parseInt(el.dataset.idx);
    const url = getPhotos(owner)[idx] || '';
    renderBlockImageInner(el, url);
  });
}

// ── Tabs ──────────────────────────────────────────────────
function renderTabs() {
  const nav = document.getElementById('momento-tabs');
  nav.innerHTML = ALL_TABS.map(m => {
    const n = m.id === ITINERARIO_ID
      ? state.itinerary.length
      : (state.blocks[m.id] || []).length;
    return `<button class="momento-tab ${m.id === activeMomento ? 'active' : ''}" data-momento="${m.id}">
      ${m.label} <span class="count">${n ? '· ' + n : ''}</span>
    </button>`;
  }).join('');
  nav.querySelectorAll('[data-momento]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeMomento = btn.dataset.momento;
      renderAll();
    });
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 900;
      const r = Math.min(MAX / img.width, MAX / img.height, 1);
      const w = Math.round(img.width * r), h = Math.round(img.height * r);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ── Modal ─────────────────────────────────────────────────
let pendingSection = null, pendingIdx = null, activeTab = 'file';
let pendingNewImageBlock = null; // si no es null, al guardar se crea un bloque de imagen nuevo
const modalBg   = document.getElementById('modal');
const urlInput  = document.getElementById('url-input');
const fileInput = document.getElementById('file-input');
const paneFile  = document.getElementById('pane-file');
const paneUrl   = document.getElementById('pane-url');
const progressWrap = document.getElementById('upload-progress');
const progressBar  = document.getElementById('upload-bar');

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    paneFile.classList.toggle('active', activeTab === 'file');
    paneUrl.classList.toggle('active',  activeTab === 'url');
  });
});

document.getElementById('modal-cancel').addEventListener('click', closeModal);
modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmModal(); });
document.getElementById('modal-confirm').addEventListener('click', confirmModal);

async function finishPhoto(url) {
  await setPhoto(pendingSection, pendingIdx, url);
  if (pendingNewImageBlock === pendingSection) {
    const id = pendingNewImageBlock;
    pendingNewImageBlock = null;
    appendNewBlock({ id, type: 'image', photoOwner: id, photoIdx: 0 });
  }
}

async function confirmModal() {
  const btn = document.getElementById('modal-confirm');
  if (activeTab === 'url') {
    const url = urlInput.value.trim(); if (!url) return;
    btn.disabled = true; btn.textContent = 'Guardando…';
    try {
      await finishPhoto(url);
      closeModal();
    } catch (e) {
      alert('No se pudo guardar la foto: ' + e.message);
    }
    btn.disabled = false; btn.textContent = 'Guardar';
  } else {
    const file = fileInput.files[0]; if (!file) return;
    btn.disabled = true; btn.textContent = 'Procesando…';
    progressWrap.style.display = 'block';
    progressBar.style.width = '60%';
    try {
      const dataUrl = await compressImage(file);
      progressBar.style.width = '85%';
      await finishPhoto(dataUrl);
      progressBar.style.width = '100%';
      closeModal();
    } catch(e) {
      alert('No se pudo subir la foto: ' + e.message);
    }
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

function openModal(ownerId, idx) {
  pendingSection = ownerId; pendingIdx = idx;
  urlInput.value = ''; fileInput.value = '';
  progressWrap.style.display = 'none'; progressBar.style.width = '0%';
  document.getElementById('modal-confirm').disabled = false;
  document.getElementById('modal-confirm').textContent = 'Guardar';
  modalBg.classList.add('open');
}
function closeModal() { modalBg.classList.remove('open'); pendingNewImageBlock = null; }

// ── Fotos (cada una su propio documento en Firestore) ──────
function getPhotos(ownerId) {
  return state.photos[ownerId] || ['', '', ''];
}

async function setPhoto(ownerId, idx, url) {
  await setDoc(doc(db, 'inspo', photoDocId(ownerId, idx)), {
    kind: 'momento_photo', cardId: ownerId, idx, url,
  });
  const p = [...getPhotos(ownerId)]; p[idx] = url;
  state.photos[ownerId] = p;
  const el = document.querySelector(`.block-image[data-owner="${ownerId}"][data-idx="${idx}"]`);
  if (el) renderBlockImageInner(el, url);
}
function deletePhotoDoc(ownerId, idx) {
  deleteDoc(doc(db, 'inspo', photoDocId(ownerId, idx))).catch(() => {});
}

function addHintHtml() {
  return `<div class="add-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="3" y="3" width="18" height="18" rx="3"/>
    <line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
  </svg><span>Añadir foto</span></div>`;
}
function renderBlockImageInner(el, url) {
  el.innerHTML = url ? `<img src="${url}" alt="" loading="lazy"/>` : addHintHtml();
}

// ── Bloques (texto / imagen / check) ────────────────────────
const IC_DEL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;

function buildBlock(b) {
  const list = state.blocks[activeMomento] || [];
  const idx = list.indexOf(b);
  const isFirst = idx <= 0;
  const isLast = idx === -1 || idx === list.length - 1;

  const el = document.createElement('div');
  el.className = `block block-${b.type}${b.type === 'check' && b.done ? ' done' : ''}`;
  el.dataset.id = b.id;

  const controlsHTML = `
    <div class="block-controls">
      <button class="ctrl-btn block-up" title="Subir" ${isFirst ? 'disabled' : ''}>↑</button>
      <button class="ctrl-btn block-down" title="Bajar" ${isLast ? 'disabled' : ''}>↓</button>
      <button class="ctrl-btn block-del" title="Eliminar">${IC_DEL}</button>
    </div>`;

  if (b.type === 'text') {
    el.innerHTML = `${controlsHTML}
      <div class="block-text" contenteditable="true" data-id="${b.id}" data-ph="Escribe aquí…" spellcheck="false">${b.content || ''}</div>`;
    const t = el.querySelector('.block-text');
    let tm; t.addEventListener('input', () => {
      b.content = t.innerHTML; // al momento en memoria, para que un redibujado no lo pierda
      clearTimeout(tm); tm = setTimeout(persistBlocksDebounced, 400); // solo el guardado en red se retrasa
    });
  } else if (b.type === 'check') {
    el.innerHTML = `${controlsHTML}
      <div class="check-row">
        <input type="checkbox" class="check-box" ${b.done ? 'checked' : ''} />
        <div class="check-text" contenteditable="true" data-ph="Algo por decidir…" spellcheck="false">${b.text || ''}</div>
      </div>`;
    el.querySelector('.check-box').addEventListener('change', e => {
      b.done = e.target.checked;
      el.classList.toggle('done', b.done);
      persistBlocks();
    });
    const txt = el.querySelector('.check-text');
    let tm; txt.addEventListener('input', () => {
      b.text = txt.innerHTML;
      clearTimeout(tm); tm = setTimeout(persistBlocksDebounced, 400);
    });
  } else if (b.type === 'image') {
    const url = getPhotos(b.photoOwner)[b.photoIdx] || '';
    el.innerHTML = `${controlsHTML}
      <div class="block-image" data-owner="${b.photoOwner}" data-idx="${b.photoIdx}">${url ? `<img src="${url}" alt="" loading="lazy"/>` : addHintHtml()}</div>`;
    el.querySelector('.block-image').addEventListener('click', () => openModal(b.photoOwner, b.photoIdx));
  }

  el.querySelector('.block-del').addEventListener('click', () => deleteBlock(b.id));
  el.querySelector('.block-up').addEventListener('click', () => moveBlock(b.id, -1));
  el.querySelector('.block-down').addEventListener('click', () => moveBlock(b.id, 1));
  return el;
}

// Mueve un bloque un puesto arriba (dir -1) o abajo (dir 1) dentro de su
// momento. Solo reordena el DOM (insertBefore) y actualiza el estado de
// los botones ↑/↓ afectados — nunca reconstruye los demás bloques, por la
// misma razón que añadir/borrar: no perder el foco de otro bloque en edición.
function moveBlock(id, dir) {
  const list = state.blocks[activeMomento] || [];
  const i = list.findIndex(x => x.id === id);
  if (i === -1) return;
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  persistBlocks();

  const container = document.getElementById('container');
  const el = container.querySelector(`.block[data-id="${id}"]`);
  if (el) {
    if (dir < 0 && el.previousElementSibling) container.insertBefore(el, el.previousElementSibling);
    else if (dir > 0 && el.nextElementSibling) container.insertBefore(el.nextElementSibling, el);
  }
  updateBlockControlsState();
}

function updateBlockControlsState() {
  const list = state.blocks[activeMomento] || [];
  list.forEach((b, i) => {
    const el = document.querySelector(`.block[data-id="${b.id}"]`);
    if (!el) return;
    const up = el.querySelector('.block-up');
    const down = el.querySelector('.block-down');
    if (up) up.disabled = (i === 0);
    if (down) down.disabled = (i === list.length - 1);
  });
}

// Las altas/bajas de bloques tocan solo su propio elemento en el DOM, sin
// reconstruir los demás — si no, un redibujado completo mientras escribes
// en otro bloque te haría perder el foco (y, antes de este arreglo,
// incluso lo que acababas de escribir si el guardado con debounce aún no
// había llegado a actualizar el estado en memoria).
function deleteBlock(id) {
  const list = state.blocks[activeMomento] || [];
  const b = list.find(x => x.id === id);
  if (!b) return;
  if (!confirm('¿Eliminar esto?')) return;
  const newList = list.filter(x => x.id !== id);
  state.blocks[activeMomento] = newList;
  if (b.type === 'image') deletePhotoDoc(b.photoOwner, b.photoIdx);
  persistBlocks();
  if (!newList.length) { renderAll(); return; }
  renderTabs();
  document.querySelector(`.block[data-id="${id}"]`)?.remove();
  updateBlockControlsState();
}

function appendNewBlock(block) {
  state.blocks[activeMomento] = state.blocks[activeMomento] || [];
  state.blocks[activeMomento].push(block);
  persistBlocks();
  renderTabs();
  const container = document.getElementById('container');
  container.querySelector('.empty-hint')?.remove();
  const addBar = container.querySelector('.block-add-bar');
  const el = buildBlock(block);
  container.insertBefore(el, addBar);
  updateBlockControlsState();
  return el;
}

function renderBlockAddBar(container) {
  const wrap = document.createElement('div');
  wrap.className = 'add-section-area block-add-bar';
  wrap.innerHTML = `
    <button class="add-btn" id="add-text-btn">✎ Texto</button>
    <button class="add-btn" id="add-image-btn">🖼 Foto</button>
    <button class="add-btn" id="add-check-btn">☑ Check</button>`;
  // El foco se dispara en el mismo clic (sin requestAnimationFrame): en
  // iOS Safari, si el foco a un campo editable no ocurre de forma
  // síncrona dentro del gesto del usuario, el teclado en pantalla no
  // aparece — parece que "no deja escribir" aunque el campo sí esté
  // enfocado.
  wrap.querySelector('#add-text-btn').addEventListener('click', () => {
    const id = 'b_' + Date.now();
    const el = appendNewBlock({ id, type: 'text', content: '' });
    el.querySelector('.block-text')?.focus();
  });
  wrap.querySelector('#add-check-btn').addEventListener('click', () => {
    const id = 'b_' + Date.now();
    const el = appendNewBlock({ id, type: 'check', text: '', done: false });
    el.querySelector('.check-text')?.focus();
  });
  wrap.querySelector('#add-image-btn').addEventListener('click', () => {
    const id = 'b_' + Date.now();
    pendingNewImageBlock = id;
    openModal(id, 0);
  });
  container.appendChild(wrap);
}

function renderAll() {
  renderTabs();
  const container = document.getElementById('container');
  container.innerHTML = '';
  if (activeMomento === ITINERARIO_ID) {
    renderItinerario(container);
  } else {
    const blocks = state.blocks[activeMomento] || [];
    if (!blocks.length) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      const label = MOMENTOS.find(m => m.id === activeMomento)?.label || '';
      hint.innerHTML = `<strong>Hoja en blanco</strong>Añade texto, fotos o checks para ${label}`;
      container.appendChild(hint);
    } else {
      blocks.forEach(b => container.appendChild(buildBlock(b)));
    }
    renderBlockAddBar(container);
  }
}

// ── Itinerario ──────────────────────────────────────────────
// El <input type="time"> nativo se muestra en 12h o 24h según el idioma/
// región del teléfono, algo que no se puede forzar de forma fiable en
// todos los navegadores (Safari en iOS, sobre todo, ignora el lang del
// input). Por eso se calcula aparte una etiqueta con el formato AM/PM,
// que siempre se ve igual sin importar el dispositivo.
function formatHora12(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return '';
  const period = h < 12 ? 'AM' : 'PM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}

function buildItinRow(r) {
  const row = document.createElement('div');
  row.className = 'itin-row'; row.dataset.id = r.id;
  row.innerHTML = `
    <div class="itin-hora-wrap">
      <input type="time" class="itin-hora" lang="en-US" value="${r.hora || ''}" />
      <span class="itin-ampm">${formatHora12(r.hora)}</span>
    </div>
    <div class="itin-main">
      <input type="text" class="itin-evento" placeholder="Evento (ej. Entrada de los novios)" value="${(r.evento || '').replace(/"/g, '&quot;')}" />
      <input type="text" class="itin-nota" placeholder="Nota (opcional)" value="${(r.nota || '').replace(/"/g, '&quot;')}" />
    </div>
    <button class="ctrl-btn itin-del" title="Eliminar">${IC_DEL}</button>`;

  const horaEl  = row.querySelector('.itin-hora');
  const ampmEl  = row.querySelector('.itin-ampm');
  horaEl.addEventListener('input', () => { ampmEl.textContent = formatHora12(horaEl.value); });
  horaEl.addEventListener('change', () => { updateItinField(r.id, 'hora', horaEl.value); renderAll(); });

  const evEl = row.querySelector('.itin-evento');
  let et; evEl.addEventListener('input', () => {
    r.evento = evEl.value;
    clearTimeout(et); et = setTimeout(persistItinerary, 400);
  });

  const noEl = row.querySelector('.itin-nota');
  let nt; noEl.addEventListener('input', () => {
    r.nota = noEl.value;
    clearTimeout(nt); nt = setTimeout(persistItinerary, 400);
  });

  row.querySelector('.itin-del').addEventListener('click', () => deleteItinRow(r.id));
  return row;
}

function updateItinField(id, field, value) {
  const row = state.itinerary.find(r => r.id === id);
  if (!row) return;
  row[field] = value;
  persistItinerary();
}

function deleteItinRow(id) {
  if (!confirm('¿Eliminar esta fila del itinerario?')) return;
  state.itinerary = state.itinerary.filter(r => r.id !== id);
  persistItinerary();
  renderAll();
}

function renderItinerario(container) {
  const rows = [...state.itinerary].sort((a, b) => (a.hora || '99:99').localeCompare(b.hora || '99:99'));
  if (!rows.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = `<strong>Nada por aquí todavía</strong>Añade la primera hora del itinerario`;
    container.appendChild(hint);
  } else {
    const list = document.createElement('div');
    list.className = 'itin-list';
    rows.forEach(r => list.appendChild(buildItinRow(r)));
    container.appendChild(list);
  }

  const wrap = document.createElement('div');
  wrap.className = 'add-section-area';
  wrap.innerHTML = `
    <button class="add-btn" id="add-itin-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      Añadir hora
    </button>`;
  wrap.querySelector('#add-itin-btn').addEventListener('click', () => {
    const id = 'i_' + Date.now();
    state.itinerary.push({ id, hora: '', evento: '', nota: '' });
    persistItinerary();
    renderAll();
    document.querySelector(`.itin-row[data-id="${id}"] .itin-evento`)?.focus();
  });
  container.appendChild(wrap);
}

renderAll();
</script>
